
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFAF3" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>Recoz Feedback | Customer Feedback Platform</title>
    <meta
      name="description"
      content="Collect, analyze, and manage customer feedback with Recoz Feedback. Track NPS, CSAT, and CES, uncover insights, and turn customer feedback into action."
    />
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Recoz Feedback | Customer Feedback Platform"
    />
    <meta
      property="og:description"
      content="Understand customer sentiment, track feedback, and improve customer experiences with Recoz Feedback."
    />
    <meta property="og:site_name" content="Recoz Feedback" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Recoz Feedback | Customer Feedback Platform"
    />
    <meta
      name="twitter:description"
      content="Turn customer feedback into actionable insights with Recoz Feedback."
    />
  </head>

  <body class="bg-[#FFFAF3] text-[#1f1b18] font-inter antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
